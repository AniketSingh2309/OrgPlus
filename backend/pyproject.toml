[project]
name = "orgpulse"
version = "0.1.0"
description = "Google Workspace org activity dashboard: API + sync worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic-settings>=2.6,<2.7",
    "google-auth>=2.36,<3",
    "google-api-python-client>=2.154,<3",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "pyjwt>=2.9,<3",
    "geoip2>=4.8,<5",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
    "python-socketio>=5.11,<6",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "python-socketio[client]>=5.11,<6", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orgpulse*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# google-auth ships without type hints
untyped_calls_exclude = ["google"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
# B008: FastAPI's Depends()/File() defaults are the framework idiom.
# E501: the formatter owns line length; long SQL strings are fine.
ignore = ["B008", "E501", "RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
