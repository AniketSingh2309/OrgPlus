# Org+ behind nginx (alternative to deploy/linux/Caddyfile).
# Install: copy to /etc/nginx/sites-available/orgplus, link it into sites-enabled,
# replace orgplus.in with your domain, then: sudo nginx -t && sudo systemctl reload nginx
# Certificates: sudo certbot --nginx -d orgplus.in
#
# Security headers (CSP, HSTS, X-Frame-Options, ...) are sent by the app itself
# (web/next.config.mjs, and the API). Don't add them here too: duplicates confuse browsers.

server_tokens off;   # no nginx version in headers or error pages

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name orgplus.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orgplus.in;

    ssl_certificate     /etc/letsencrypt/live/orgplus.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orgplus.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;   # service-account key uploads are a few KB

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # the client's real IP (not appended)
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates (Socket.IO websockets) go straight to the API on localhost...
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # ...everything else to the web app, which calls the API itself on localhost.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}
