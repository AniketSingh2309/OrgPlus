# Org+ Postgres access rules (native install, no passwords).
#
# Install: copy over the server's pg_hba.conf (SHOW hba_file; in psql shows where it is),
# set  listen_addresses = 'localhost'  in postgresql.conf, then restart Postgres.
# Postgres then accepts connections only from this machine, and only as the roles below.
# Rules are read top to bottom; the first match wins.
#
# TYPE  DATABASE          USER             ADDRESS          METHOD

# Superuser: only your operating-system login, checked by the OS itself, never trusted by TCP.
#   Windows: SSPI. Map your Windows account to "postgres" in pg_ident.conf (see the one here).
host    all               postgres         127.0.0.1/32     sspi include_realm=0 map=orgplus_super
host    all               postgres         ::1/128          sspi include_realm=0 map=orgplus_super
#   Linux/macOS instead: delete the two sspi lines above and uncomment these
#   (then use: sudo -u postgres psql).
# local   all             postgres                          peer
# local   all             all                               reject
# host    all             postgres         127.0.0.1/32     reject
# host    all             postgres         ::1/128          reject

# Provisioning role (creates each organisation's role + database): the "postgres" database only.
host    postgres          orgplus_admin    127.0.0.1/32     trust
host    postgres          orgplus_admin    ::1/128          trust

# Control database (organisation list, sealed per-org keys).
host    orgplus_control   orgplus_control  127.0.0.1/32     trust
host    orgplus_control   orgplus_control  ::1/128          trust

# Each organisation's role may open ONLY the database of the same name
# (orgplus_org_<id> -> orgplus_org_<id>); the databases also revoke CONNECT from everyone else.
host    sameuser          all              127.0.0.1/32     trust
host    sameuser          all              ::1/128          trust

# Everything else, from anywhere (including the network): refused.
host    all               all              0.0.0.0/0        reject
host    all               all              ::/0             reject
