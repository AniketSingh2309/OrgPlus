# Windows only: which Windows account may log in as the Postgres superuser (SSPI, no password).
# Copy over the server's pg_ident.conf (SHOW ident_file; in psql) and replace YOUR_WINDOWS_USER
# with the account that administers this server (e.g. Core5). Restart or reload Postgres.
#
# MAPNAME         SYSTEM-USERNAME       PG-USERNAME
orgplus_super     YOUR_WINDOWS_USER     postgres
